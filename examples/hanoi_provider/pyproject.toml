[build-system]
requires = ["hatchling>=1.27,<2", "factw-env[extension-build]==0.1.0rc138"]
build-backend = "hatchling.build"

[project]
name = "factored-worlds-mind-hanoi-provider"
version = "0.1.0+helloworld"
description = "A bounded Hanoi planner with reusable move bindings for a Factored Mind"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pysmsl==0.2.0rc6", "factw-mind==0.1.0+helloworld"]

[tool.hatch.build.targets.wheel]
only-include = ["src/factw/mind/examples/hanoi_provider"]
sources = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
manifests = ["extension.toml"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/factw/mind/examples/hanoi_provider",
    "/tests/test_provider.py",
    "/pyproject.toml",
    "/extension.toml",
    "/hatch_build.py",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
